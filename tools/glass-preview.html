<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雨月 · 独立雨窗检查</title>
<style>body{margin:0;background:#16232e;color:#eee;font:14px system-ui}canvas{display:block}nav{position:fixed;left:14px;top:14px;padding:14px;background:#152330e8;border-radius:12px;width:235px}h1{font-size:16px;margin:0 0 10px}button{color:inherit;background:#283b49;border:1px solid #62727b;border-radius:6px;margin:3px 0;padding:7px;cursor:pointer}label{display:block;margin:10px 0}input{width:135px;vertical-align:middle}#status{white-space:pre-line;font-size:12px;line-height:1.6;margin-top:10px}a{color:#cbd6df}</style></head>
<body><nav><h1>独立雨窗检查</h1><button id="clear">清晰玻璃</button> <button id="start">坐下后渐变</button><br><button id="mature">积雨 60 秒</button> <button id="ease">雨势减弱</button><br><button id="wide">窗边全景</button> <button id="close">水珠近景</button><br><button id="pause">暂停</button>
<label>雨势 <input id="rain" aria-label="雨势" type="range" min="0" max="1" step=".01" value=".75"></label><label>朦胧 <input id="fog" aria-label="朦胧" type="range" min="0" max="1" step=".01" value=".75"></label><button id="lifecycle">单滴缩小与消退</button><div id="life-controls" hidden><button data-life=".3">0.3 秒</button> <button data-life="1.8">1.8 秒</button> <button data-life="2.8">2.8 秒</button> <button data-life="4.8">4.8 秒</button></div><br><button id="inspect">检查水滴图数据</button><br><a href="../">返回游戏</a><div id="status">正在准备渲染…</div></nav><script type="module" src="./glass-preview.js"></script></body></html>
